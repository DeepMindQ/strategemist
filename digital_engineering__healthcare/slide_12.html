<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="global.css">
<style>
  .close-eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .close-display {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--primary);
  }
  .close-display .line2 { color: var(--accent); display: block; }
  .close-contact {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.7;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  .vertical-hairline {
    position: absolute;
    top: 96px;
    bottom: 96px;
    left: 70%;
    width: 1px;
    background: var(--border);
  }
  .right-callouts {
    position: absolute;
    top: 50%;
    left: 70%;
    transform: translate(0, -50%);
    margin-left: 36px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    align-items: flex-end;
  }
  .right-callout {
    font-family: var(--font-num);
    font-size: 16px;
    color: var(--brand);
    letter-spacing: 0.06em;
    font-weight: 500;
    text-transform: uppercase;
  }
  .right-callout.accent { color: var(--accent); font-weight: 600; }
  .close-headline-block {
    position: absolute;
    top: 240px;
    left: 104px;
    max-width: 720px;
  }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe"></div>

  <!-- Top-left: logo (single image logo on closing) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="KEFI TECH" style="position:absolute; top:96px; left:104px;">

  <!-- Vertical hairline divider at ~70% -->
  <div class="vertical-hairline" aria-hidden="true" data-decor></div>

  <!-- Right-side stacked callouts -->
  <div class="right-callouts">
    <div class="right-callout">Discover.</div>
    <div class="right-callout">Engineer.</div>
    <div class="right-callout accent">Scale.</div>
  </div>

  <!-- Center-left headline block -->
  <div class="close-headline-block">
    <div class="close-eyebrow">Get in Touch</div>
    <div class="close-display" style="margin-top:20px;">
      <span>Let us engineer</span>
      <span class="line2">what is next.</span>
    </div>
    <div class="close-contact" style="margin-top:32px;">
      <div>info@kefitech.com  ·  www.kefitech.com</div>
      <div>Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>info@kefitech.com · www.kefitech.com</span>
  </div>
</div>
</body>
</html>
