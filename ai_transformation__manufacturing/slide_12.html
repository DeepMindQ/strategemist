<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .closing-headline {
    font-family: var(--font-heading); font-size: 56px; font-weight: 700;
    line-height: 1.08; letter-spacing: -0.02em;
  }
  .closing-headline .line-primary { color: var(--primary); display: block; }
  .closing-headline .line-accent  { color: var(--accent); display: block; font-style: italic; }
  .closing-eyebrow {
    font-family: var(--font-body); font-size: 11px; font-weight: 700;
    color: var(--brand); letter-spacing: 0.22em; text-transform: uppercase;
  }
  .contact-line {
    font-family: var(--font-body); font-size: 16px; color: var(--text-secondary);
    line-height: 1.6; letter-spacing: 0.01em;
  }
  .contact-line .dot { color: var(--accent); font-weight: 700; padding: 0 8px; }

  .right-rail {
    position: absolute; right: 104px; top: 240px;
    display: grid; grid-template-columns: 1fr 1px; gap: 0 28px;
    align-items: stretch; height: 280px;
  }
  .right-rail .hair { background: var(--border); }
  .right-callouts {
    display: flex; flex-direction: column; justify-content: space-between;
    align-items: flex-end; padding: 6px 0;
  }
  .right-callout {
    font-family: var(--font-num); font-size: 16px;
    color: var(--brand); letter-spacing: 0.08em; font-weight: 500;
    text-align: right; line-height: 1.2;
  }
  .right-callout.accent { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe"></div>

  <!-- Top-left logo -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Center-left composition -->
  <div style="position:absolute; left:104px; top:240px; max-width:780px;">
    <div class="closing-eyebrow" style="margin-bottom:18px;">GET IN TOUCH</div>
    <h1 class="closing-headline">
      <span class="line-primary">Let us engineer</span>
      <span class="line-accent">what is next.</span>
    </h1>
    <div class="accent-bar" style="margin-top:24px; margin-bottom:22px;"></div>
    <div class="contact-line">info@kefitech.com<span class="dot">·</span>www.kefitech.com</div>
    <div class="contact-line">Bengaluru, India<span class="dot">·</span>Hyderabad, India</div>
  </div>

  <!-- Right vertical hairline + three stacked callouts -->
  <div class="right-rail" aria-hidden="true" data-decor>
    <div class="right-callouts">
      <div class="right-callout">Discover.</div>
      <div class="right-callout">Engineer.</div>
      <div class="right-callout accent">Scale.</div>
    </div>
    <div class="hair"></div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
