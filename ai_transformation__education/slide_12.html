<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Closing</title>
  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="slide grid-bg" style="padding: 0;">
    <div class="brand-stripe" data-decor></div>

    <!-- Logo top-left -->
    <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

    <!-- Center-left composition -->
    <div style="position:absolute; top:240px; left:104px; max-width:780px;">
      <div class="eyebrow" style="font-size:12px;">GET IN TOUCH</div>
      <h1 style="font-family:var(--font-heading); font-size:56px; font-weight:700; line-height:1.08; margin:18px 0 0 0; letter-spacing:-0.02em;">
        <span style="color:var(--primary); display:block;">Let us engineer</span>
        <span style="color:var(--accent); display:block;">what is next.</span>
      </h1>
      <div style="margin-top:32px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5; letter-spacing:0.01em;">
          info@kefitech.com &nbsp;·&nbsp; www.kefitech.com
        </div>
        <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5; letter-spacing:0.01em;">
          Bengaluru, India &nbsp;·&nbsp; Hyderabad, India
        </div>
      </div>
    </div>

    <!-- Right side: vertical hairline + 3 stacked callouts (right-aligned) -->
    <div style="position:absolute; top:240px; right:104px; height:280px; display:flex; gap:22px; align-items:stretch;">
      <div style="display:grid; grid-template-rows: 1fr 1fr 1fr; align-items:end; height:100%; padding:6px 0;">
        <div style="font-family:var(--font-num); font-size:14px; color:var(--brand); letter-spacing:0.06em; font-weight:500; text-align:right;">Discover.</div>
        <div style="font-family:var(--font-num); font-size:14px; color:var(--brand); letter-spacing:0.06em; font-weight:500; text-align:right;">Engineer.</div>
        <div style="font-family:var(--font-num); font-size:14px; color:var(--accent); letter-spacing:0.06em; font-weight:500; text-align:right;">Scale.</div>
      </div>
      <div style="width:1px; background:var(--border);"></div>
    </div>

    <!-- Foot rail -->
    <div class="foot-rail bordered">
      <span class="text-wordmark">KEFI TECH</span>
      <span>12 / 12</span>
      <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
    </div>
  </div>
</body>
</html>
