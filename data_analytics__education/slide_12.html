<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  .slide { padding: 0 !important; }
  .logo-anchor { position: absolute; top: 96px; left: 104px; }

  .center-block {
    position: absolute;
    top: 232px;
    left: 104px;
    right: 540px;
  }
  .close-eyebrow { margin-bottom: 20px; }
  .close-headline {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.025em;
    margin: 0;
  }
  .close-headline .l1 { color: var(--primary); display: block; }
  .close-headline .l2 { color: var(--accent); display: block; }
  .close-contacts {
    margin-top: 30px;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.7;
    font-weight: 400;
  }
  .close-contacts div { display: block; }

  .right-rail {
    position: absolute;
    top: 220px;
    bottom: 200px;
    left: 70%;
    width: 1px;
    background: var(--border-strong);
  }
  .right-callouts {
    position: absolute;
    top: 220px;
    left: calc(70% + 24px);
    right: 104px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 28px;
    font-family: var(--font-num);
    font-size: 18px;
    color: var(--brand);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .right-callouts .row { display: block; }
  .right-callouts .accent { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <img src="assets/kefi_logo.png" class="kefi-logo-lg logo-anchor" alt="KEFI TECH">

  <div class="center-block">
    <div class="eyebrow close-eyebrow">GET IN TOUCH</div>
    <h1 class="close-headline">
      <span class="l1">Let us engineer</span>
      <span class="l2">what is next.</span>
    </h1>
    <div class="close-contacts">
      <div>info@kefitech.com  ·  www.kefitech.com</div>
      <div>Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <div class="right-rail" data-decor aria-hidden="true"></div>
  <div class="right-callouts">
    <span class="row">Discover.</span>
    <span class="row">Engineer.</span>
    <span class="row accent">Scale.</span>
  </div>

  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
