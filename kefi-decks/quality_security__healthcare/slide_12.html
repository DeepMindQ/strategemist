<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  .close-canvas { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  .close-logo-anchor { position: absolute; top: 96px; left: 104px; z-index: 5; }
  .close-eyebrow { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brand); }
  .close-display { font-family: var(--font-heading); font-size: 56px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .close-contact { font-family: var(--font-body); font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
  .close-callout { font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: var(--primary); line-height: 1.2; letter-spacing: -0.01em; text-align: right; }
  .close-callout.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide close-canvas grid-bg" style="padding:0;">
  <div class="brand-stripe" aria-hidden="true" data-decor></div>

  <!-- Top-left logo -->
  <div class="close-logo-anchor">
    <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech">
  </div>

  <!-- Vertical hairline at ~70% -->
  <div aria-hidden="true" data-decor style="position:absolute; top:160px; bottom:120px; left:70%; width:1px; background:var(--border);"></div>

  <!-- Right-side stacked callouts (right-aligned) -->
  <div style="position:absolute; top:240px; left:calc(70% + 36px); right:104px; display:flex; flex-direction:column; align-items:flex-end; gap:32px;">
    <div class="close-callout">Discover.</div>
    <div class="close-callout">Engineer.</div>
    <div class="close-callout accent">Scale.</div>
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; width:680px;">
    <div class="close-eyebrow">GET IN TOUCH</div>
    <div class="close-display" style="color:var(--primary); margin-top:18px;">Let us engineer</div>
    <div class="close-display" style="color:var(--accent); margin-top:4px;">what is next.</div>
    <div class="accent-bar" style="margin-top:24px;"></div>
    <div style="margin-top:24px; display:flex; flex-direction:column; gap:6px;">
      <div class="close-contact">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="close-contact">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered" style="position:absolute; left:104px; right:104px; bottom:40px;">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>

  <aside data-notes aria-hidden="true" style="display:none;">none</aside>
</div>
</body>
</html>
