<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" aria-hidden="true"></div>

  <!-- Top-left: Kefi Tech logo -->
  <div style="position:absolute; top:96px; left:104px;">
    <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech logo">
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; left:104px; top:280px; max-width:780px;">
    <div class="eyebrow" style="margin-bottom:18px;">Get In Touch</div>

    <h1 style="font-family:var(--font-heading); font-weight:700; font-size:56px; line-height:1.05; letter-spacing:-0.02em; margin:0; color:var(--primary);">
      Let us engineer
    </h1>
    <h1 style="font-family:var(--font-heading); font-weight:700; font-size:56px; line-height:1.05; letter-spacing:-0.02em; margin:6px 0 0 0; color:var(--accent);">
      what is next.
    </h1>

    <p style="font-family:var(--font-body); font-size:16px; line-height:1.6; color:var(--text-secondary); margin:28px 0 0 0;">
      info@kefitech.com  ·  www.kefitech.com
    </p>
    <p style="font-family:var(--font-body); font-size:16px; line-height:1.6; color:var(--text-secondary); margin:4px 0 0 0;">
      Bengaluru, India  ·  Hyderabad, India
    </p>
  </div>

  <!-- Right side: vertical hairline + callouts -->
  <div style="position:absolute; right:104px; top:280px; height:200px; display:grid; grid-template-columns:1fr 1px; gap:24px; align-items:end;">
    <div style="display:flex; flex-direction:column; gap:24px; align-items:flex-end; text-align:right;">
      <div style="font-family:var(--font-num); font-size:18px; font-weight:600; color:var(--brand); letter-spacing:0.04em;">Discover.</div>
      <div style="font-family:var(--font-num); font-size:18px; font-weight:600; color:var(--brand); letter-spacing:0.04em;">Engineer.</div>
      <div style="font-family:var(--font-num); font-size:18px; font-weight:600; color:var(--accent); letter-spacing:0.04em;">Scale.</div>
    </div>
    <div style="width:1px; height:100%; background:var(--border);"></div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>info@kefitech.com · www.kefitech.com</span>
  </div>

  <aside data-notes hidden>none</aside>
</div>
</body>
</html>
