<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  .closing-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .closing-headline {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.02em;
  }
  .closing-headline .line-primary { color: var(--primary); display: block; }
  .closing-headline .line-accent { color: var(--accent); display: block; }
  .closing-contact {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.7;
    font-weight: 400;
  }
  .vcallout {
    font-family: var(--font-num);
    font-size: 13px;
    font-weight: 600;
    color: var(--brand);
    letter-spacing: 0.18em;
    text-align: right;
    line-height: 1;
  }
  .vcallout.accent { color: var(--accent); }
  .v-divider {
    position: absolute;
    top: 220px;
    bottom: 130px;
    left: 70%;
    width: 1px;
    background: var(--border);
  }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" aria-hidden="true"></div>

  <!-- Top-left: Kefi Tech logo image -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Right-side vertical hairline + callouts -->
  <div class="v-divider" aria-hidden="true"></div>
  <div style="position:absolute; top:240px; left:72%; display:flex; flex-direction:column; gap:64px; align-items:flex-end;">
    <div class="vcallout">Discover.</div>
    <div class="vcallout">Engineer.</div>
    <div class="vcallout accent">Scale.</div>
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; max-width:780px;">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline" style="margin-top:18px;">
      <span class="line-primary">Let us engineer</span>
      <span class="line-accent">what is next.</span>
    </h1>
    <div class="closing-contact" style="margin-top:28px;">
      info@kefitech.com &nbsp;&middot;&nbsp; www.kefitech.com<br>
      Bengaluru, India &nbsp;&middot;&nbsp; Hyderabad, India
    </div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM &middot; WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
