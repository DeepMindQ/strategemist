<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  .closing-eyebrow { font-family: var(--font-num); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
  .closing-headline { font-family: var(--font-heading); font-size: 56px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .contact-line { font-family: var(--font-body); font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
  .right-callout { font-family: var(--font-num); font-size: 18px; font-weight: 600; letter-spacing: 0.04em; color: var(--brand); }
  .right-callout.accent { color: var(--accent); }
  .vertical-rule { position: absolute; top: 96px; bottom: 96px; left: 70%; width: 1px; background: var(--border); }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left logo -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Vertical hairline divider -->
  <div class="vertical-rule" data-decor></div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; right:440px;">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline" style="margin-top:14px;">
      Let us engineer<br>
      <span style="color: var(--accent);">what is next.</span>
    </h1>
    <div style="margin-top:24px; display:flex; flex-direction:column; gap:6px;">
      <div class="contact-line">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="contact-line">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right-side stacked callouts -->
  <div style="position:absolute; top:240px; right:72px; width:300px; display:flex; flex-direction:column; gap:32px; align-items:flex-end; text-align:right;">
    <div class="right-callout">Discover.</div>
    <div class="right-callout">Engineer.</div>
    <div class="right-callout accent">Scale.</div>
  </div>

  <!-- Foot-rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
