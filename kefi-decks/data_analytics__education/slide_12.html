<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 12 — Closing</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  .slide.closing { padding: 0; }
  .closing-logo {
    position: absolute;
    top: 96px;
    left: 94px;
    z-index: 5;
  }
  .closing-content {
    position: absolute;
    top: 50%;
    left: 104px;
    transform: translateY(-50%);
    width: 720px;
  }
  .closing-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 700;
    margin-bottom: 18px;
  }
  .closing-headline {
    font-family: var(--font-heading);
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    font-weight: 700;
  }
  .closing-headline .line1 { color: var(--primary); display: block; }
  .closing-headline .line2 { color: var(--accent); display: block; }
  .closing-accent-bar {
    width: 48px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin: 28px 0 26px 0;
  }
  .closing-contact {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .closing-contact-line {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.5;
    font-weight: 400;
  }
  .closing-right {
    position: absolute;
    top: 50%;
    right: 72px;
    transform: translateY(-50%);
    width: 280px;
    border-left: 1px solid var(--border);
    padding-left: 28px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    align-items: flex-end;
    text-align: right;
  }
  .closing-callout {
    font-family: var(--font-num);
    font-size: 22px;
    color: var(--brand);
    font-weight: 500;
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  .closing-callout.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide closing grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <img src="assets/kefi_logo.png" class="kefi-logo-lg closing-logo" alt="Kefi Tech logo">

  <div class="closing-content">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline">
      <span class="line1">Let us engineer</span>
      <span class="line2">what is next.</span>
    </h1>
    <div class="closing-accent-bar"></div>
    <div class="closing-contact">
      <div class="closing-contact-line">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="closing-contact-line">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <div class="closing-right">
    <div class="closing-callout">Discover.</div>
    <div class="closing-callout">Engineer.</div>
    <div class="closing-callout accent">Scale.</div>
  </div>

  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>

  <aside data-notes>none</aside>
</div>
</body>
</html>
