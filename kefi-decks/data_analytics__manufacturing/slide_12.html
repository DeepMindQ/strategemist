<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Manufacturing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="global.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  .closing-display { font-family: var(--font-heading); font-size: 56px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; }
  .closing-eyebrow { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
  .contact-line { font-family: var(--font-body); font-size: 16px; color: var(--text-secondary); line-height: 1.7; letter-spacing: 0.01em; }
  .v-callout { font-family: var(--font-num); font-size: 14px; color: var(--brand); letter-spacing: 0.04em; font-weight: 600; line-height: 1.25; text-align: right; }
  .v-callout.accent { color: var(--accent); }
  .v-callout-num { font-family: var(--font-num); font-size: 10px; color: var(--text-muted); letter-spacing: 0.18em; font-weight: 600; text-align: right; }
  .v-divider { width: 1px; background: var(--border); height: 220px; }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <!-- Top-left logo (single image, width-locked class) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Center-left composition -->
  <div style="position:absolute; top:248px; left:104px; max-width:760px; display:flex; flex-direction:column; gap:18px;">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-display">
      <span style="color:var(--primary);">Let us engineer</span><br>
      <span style="color:var(--accent);">what is next.</span>
    </h1>
    <div class="accent-bar" data-decor aria-hidden="true"></div>
    <div style="margin-top:4px;">
      <div class="contact-line">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="contact-line">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right vertical hairline + stacked callouts -->
  <div style="position:absolute; top:268px; right:104px; display:flex; align-items:flex-start; gap:28px;">
    <div style="display:flex; flex-direction:column; gap:36px; align-items:flex-end; padding-top:2px;">
      <div>
        <div class="v-callout-num">01</div>
        <div class="v-callout">Discover.</div>
      </div>
      <div>
        <div class="v-callout-num">02</div>
        <div class="v-callout">Engineer.</div>
      </div>
      <div>
        <div class="v-callout-num">03</div>
        <div class="v-callout accent">Scale.</div>
      </div>
    </div>
    <div class="v-divider" data-decor aria-hidden="true"></div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>

  <aside data-notes hidden>none</aside>
</div>
</body>
</html>
