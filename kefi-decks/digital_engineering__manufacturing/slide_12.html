<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 12 — Closing · Manufacturing</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  .closing-eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 700;
  }
  .closing-headline {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .closing-headline .line-1 { color: var(--primary); display: block; }
  .closing-headline .line-2 { color: var(--accent); display: block; }
  .contact-line {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .right-callouts {
    position: absolute;
    top: 240px;
    right: 104px;
    height: 240px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    border-right: 1px solid var(--border-soft);
    padding-right: 28px;
  }
  .callout-item {
    font-family: var(--font-num);
    font-size: 18px;
    color: var(--brand);
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .callout-item.accent { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="slide grid-bg" style="padding:0;">
  <div class="brand-stripe" data-decor></div>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Center-left composition -->
  <div style="position:absolute; left:104px; top:240px; max-width:720px;">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline" style="margin-top:20px;">
      <span class="line-1">Let us engineer</span>
      <span class="line-2">what is next.</span>
    </h1>
    <div class="accent-bar" style="margin-top:24px;"></div>
    <div style="margin-top:24px; display:flex; flex-direction:column; gap:6px;">
      <div class="contact-line">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="contact-line">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right rail callouts -->
  <div class="right-callouts">
    <div class="callout-item">Discover.</div>
    <div class="callout-item">Engineer.</div>
    <div class="callout-item accent">Scale.</div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered" style="left:104px; right:104px;">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
