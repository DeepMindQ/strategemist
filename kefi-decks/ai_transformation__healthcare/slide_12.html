<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Closing — Kefi Tech</title>
  <link rel="stylesheet" href="global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" aria-hidden="true"></div>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:96px; left:104px;" alt="Kefi Tech">

  <!-- Center-left composition -->
  <div style="position:absolute; left:104px; top:240px; max-width:780px;">
    <div class="eyebrow">GET IN TOUCH</div>
    <h1 style="font-family:var(--font-heading); font-size:56px; font-weight:700; line-height:1.05; margin:14px 0 0 0; letter-spacing:-0.02em;">
      <span style="color:var(--primary); display:block;">Let us engineer</span>
      <span style="color:var(--accent); display:block;">what is next.</span>
    </h1>
    <div style="margin-top:28px;">
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.7;">
        info@kefitech.com  ·  www.kefitech.com
      </div>
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.7; margin-top:6px;">
        Bengaluru, India  ·  Hyderabad, India
      </div>
    </div>
  </div>

  <!-- Right side hairline + 3 stacked callouts -->
  <div style="position:absolute; left:880px; top:240px; display:flex; gap:24px; align-items:stretch; height:340px;">
    <div style="width:1px; background:var(--border);" aria-hidden="true"></div>
    <div style="display:flex; flex-direction:column; gap:36px; align-items:flex-end; justify-content:center; min-width:240px;">
      <div style="font-family:var(--font-num); font-size:18px; color:var(--brand); font-weight:600; text-align:right;">Discover.</div>
      <div style="font-family:var(--font-num); font-size:18px; color:var(--brand); font-weight:600; text-align:right;">Engineer.</div>
      <div style="font-family:var(--font-num); font-size:18px; color:var(--accent); font-weight:600; text-align:right;">Scale.</div>
    </div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>

  <aside data-notes style="display:none;" aria-hidden="true">none</aside>
</div>
</body>
</html>
