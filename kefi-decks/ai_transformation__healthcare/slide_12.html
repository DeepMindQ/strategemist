<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="slide grid-bg">
  <!-- Brand stripe (left edge) -->
  <div class="brand-stripe" aria-hidden="true"></div>

  <!-- Top-left logo (single-logo discipline — closing only) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; right:540px;">
    <div class="eyebrow" style="margin-bottom:18px;">Get In Touch</div>
    <h1 style="font-family:var(--font-heading); font-size:56px; font-weight:700; line-height:1.06; letter-spacing:-0.02em; margin:0;">
      <span style="display:block; color:var(--primary);">Let us engineer</span>
      <span style="display:block; color:var(--accent);">what is next.</span>
    </h1>

    <div style="margin-top:28px; display:flex; flex-direction:column; gap:8px;">
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5;">
        info@kefitech.com  ·  www.kefitech.com
      </div>
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5;">
        Bengaluru, India  ·  Hyderabad, India
      </div>
    </div>
  </div>

  <!-- Right-side vertical hairline + stacked callouts -->
  <div style="position:absolute; top:236px; bottom:120px; left:896px; width:1px; background:var(--border);" aria-hidden="true"></div>
  <div style="position:absolute; top:236px; bottom:120px; left:920px; right:104px; display:grid; grid-template-rows:1fr 1fr 1fr; align-items:center; justify-items:end;">
    <div style="font-family:var(--font-num); font-size:18px; color:var(--brand); letter-spacing:0.10em; font-weight:600;">Discover.</div>
    <div style="font-family:var(--font-num); font-size:18px; color:var(--brand); letter-spacing:0.10em; font-weight:600;">Engineer.</div>
    <div style="font-family:var(--font-num); font-size:18px; color:var(--accent); letter-spacing:0.10em; font-weight:600;">Scale.</div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>info@kefitech.com · www.kefitech.com</span>
  </div>
</div>
</body>
</html>
