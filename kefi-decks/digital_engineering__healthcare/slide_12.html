<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .closing-display {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--primary);
  }
  .closing-eyebrow {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 600;
  }
  .closing-contact {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.7;
    font-weight: 400;
  }
  .closing-callouts {
    position: absolute;
    top: 240px;
    right: 96px;
    width: 280px;
    border-left: 1px solid var(--border-strong);
    padding-left: 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: flex-end;
    text-align: right;
  }
  .callout-line {
    font-family: var(--font-heading);
    font-size: 26px;
    font-weight: 700;
    color: var(--brand);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .callout-line.accent { color: var(--accent); }
  .callout-tag {
    font-family: var(--font-num);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
    display: block;
  }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Vertical hairline at ~70% -->
  <div data-decor aria-hidden="true" style="position:absolute; top:200px; bottom:160px; left:896px; width:1px; background:var(--border);"></div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; right:440px;">
    <div class="closing-eyebrow">Get in touch</div>
    <h1 class="closing-display" style="margin-top:18px;">
      <span style="display:block; color:var(--primary);">Let us engineer</span>
      <span style="display:block; color:var(--accent);">what is next.</span>
    </h1>
    <div class="accent-bar" style="margin-top:26px;"></div>
    <div class="closing-contact" style="margin-top:24px;">
      <div>info@kefitech.com&nbsp;&nbsp;·&nbsp;&nbsp;www.kefitech.com</div>
      <div>Bengaluru, India&nbsp;&nbsp;·&nbsp;&nbsp;Hyderabad, India</div>
    </div>
  </div>

  <!-- Right callouts -->
  <div class="closing-callouts">
    <div>
      <span class="callout-tag">01</span>
      <div class="callout-line">Discover.</div>
    </div>
    <div>
      <span class="callout-tag">02</span>
      <div class="callout-line">Engineer.</div>
    </div>
    <div>
      <span class="callout-tag">03</span>
      <div class="callout-line accent">Scale.</div>
    </div>
  </div>

  <!-- Foot-rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>info@kefitech.com · www.kefitech.com</span>
  </div>
</div>
</body>
</html>
