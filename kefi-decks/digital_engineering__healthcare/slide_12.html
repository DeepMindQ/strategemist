<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .close-display {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.025em;
  }
  .close-eyebrow {
    font-family: var(--font-num);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 600;
  }
  .close-contact {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.6;
    font-weight: 400;
  }
  .close-callouts {
    position: absolute;
    top: 240px;
    right: 96px;
    width: 280px;
    border-left: 1px solid var(--border-strong);
    padding-left: 28px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 26px;
  }
  .close-callout {
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--brand);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .close-callout.accent {
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Vertical hairline at ~70% width -->
  <div data-decor aria-hidden="true" style="position:absolute; top:200px; bottom:200px; left:896px; width:1px; background:var(--border);"></div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; right:440px;">
    <div class="close-eyebrow">Get in Touch</div>
    <h1 class="close-display" style="margin-top:18px;">
      <span style="display:block; color:var(--primary);">Let us engineer</span>
      <span style="display:block; color:var(--accent);">what is next.</span>
    </h1>
    <div style="margin-top:28px; display:flex; flex-direction:column; gap:6px;">
      <div class="close-contact">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="close-contact">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right-side callouts -->
  <div class="close-callouts">
    <div class="close-callout">Discover.</div>
    <div class="close-callout">Engineer.</div>
    <div class="close-callout accent">Scale.</div>
  </div>

  <!-- Foot-rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>info@kefitech.com · www.kefitech.com</span>
  </div>
</div>
</body>
</html>
