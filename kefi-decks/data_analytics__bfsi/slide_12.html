<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left logo (locked class, no inline overrides) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:96px; left:104px;" alt="Kefi Tech">

  <!-- Center-left composition -->
  <div style="position:absolute; left:104px; top:264px; width:780px;">
    <div class="eyebrow" style="margin-bottom:18px;">GET IN TOUCH</div>
    <h1 style="font-family:var(--font-heading); font-size:56px; font-weight:700; line-height:1.06; letter-spacing:-0.035em; margin:0;">
      <span style="color:var(--primary); display:block;">Let us engineer</span>
      <span style="color:var(--accent); display:block;">what is next.</span>
    </h1>
    <div style="margin-top:32px; display:flex; flex-direction:column; gap:6px;">
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5;">info@kefitech.com&nbsp;&nbsp;·&nbsp;&nbsp;www.kefitech.com</div>
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5;">Bengaluru, India&nbsp;&nbsp;·&nbsp;&nbsp;Hyderabad, India</div>
    </div>
  </div>

  <!-- Right side hairline + 3 stacked callouts (right-aligned) -->
  <div style="position:absolute; right:104px; top:264px; display:flex; gap:24px; align-items:flex-start; height:300px;">
    <div style="width:1px; height:280px; background:var(--border-strong); margin-top:6px;" data-decor></div>
    <div style="display:flex; flex-direction:column; gap:32px; align-items:flex-end; padding-top:6px;">
      <div style="font-family:var(--font-num); font-size:15px; color:var(--brand); letter-spacing:0.04em; font-weight:500;">Discover.</div>
      <div style="font-family:var(--font-num); font-size:15px; color:var(--brand); letter-spacing:0.04em; font-weight:500;">Engineer.</div>
      <div style="font-family:var(--font-num); font-size:15px; color:var(--accent); letter-spacing:0.04em; font-weight:600;">Scale.</div>
    </div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
