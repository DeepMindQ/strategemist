<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="global.css">
<style>
  .closing-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 700;
  }
  .closing-headline {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.025em;
  }
  .contact-line {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    font-weight: 400;
    line-height: 1.6;
  }
  .right-callout {
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 0.10em;
    font-weight: 600;
    text-transform: uppercase;
    text-align: right;
  }
  .right-callout.accent { color: var(--accent); }
  .vertical-hairline {
    position: absolute;
    top: 200px;
    bottom: 200px;
    right: 28%;
    width: 1px;
    background: var(--border);
  }
</style>
</head>
<body>
<aside data-notes style="display:none;">none</aside>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left logo -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:96px; left:104px;">

  <!-- Vertical hairline divider -->
  <div class="vertical-hairline" data-decor></div>

  <!-- Right-side stacked callouts -->
  <div style="position:absolute; top:240px; right:104px; display:flex; flex-direction:column; gap:36px; align-items:flex-end;">
    <div class="right-callout">Discover.</div>
    <div class="right-callout">Engineer.</div>
    <div class="right-callout accent">Scale.</div>
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; max-width:760px;">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline" style="margin-top:18px;">
      <span style="display:block; color:var(--primary);">Let us engineer</span>
      <span style="display:block; color:var(--accent);">what is next.</span>
    </h1>
    <div style="margin-top:36px; display:flex; flex-direction:column; gap:8px;">
      <div class="contact-line">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="contact-line">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
