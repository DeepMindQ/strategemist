<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<aside data-notes>none</aside>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left logo (single logo on closing) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:96px; left:104px;" alt="Kefi Tech">

  <!-- Center-left composition -->
  <div style="position:absolute; left:104px; top:268px; width:760px;">
    <div class="eyebrow" style="margin-bottom:18px;">GET IN TOUCH</div>
    <h1 style="font-family:var(--font-heading); font-size:56px; font-weight:700; line-height:1.05; letter-spacing:-0.035em; margin:0;">
      <span style="color:var(--primary); display:block;">Let us engineer</span>
      <span style="color:var(--accent); display:block;">what is next.</span>
    </h1>
    <div class="accent-bar" style="margin-top:28px; margin-bottom:22px;"></div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.4; font-weight:500; letter-spacing:0.01em;">info@kefitech.com  ·  www.kefitech.com</div>
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.4; font-weight:500; letter-spacing:0.01em;">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right hairline + three callouts (right-aligned) -->
  <div style="position:absolute; right:96px; top:268px; display:flex; gap:24px; align-items:flex-start; justify-content:flex-end;">
    <div style="display:flex; flex-direction:column; gap:36px; padding-top:6px; align-items:flex-end; min-width:200px;">
      <div style="font-family:var(--font-heading); font-size:24px; font-weight:700; color:var(--primary); line-height:1.1; letter-spacing:-0.01em;">Discover.</div>
      <div style="font-family:var(--font-heading); font-size:24px; font-weight:700; color:var(--primary); line-height:1.1; letter-spacing:-0.01em;">Engineer.</div>
      <div style="font-family:var(--font-heading); font-size:24px; font-weight:700; color:var(--accent); line-height:1.1; letter-spacing:-0.01em;">Scale.</div>
    </div>
    <div style="width:1px; height:280px; background:var(--border-strong);" data-decor></div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
