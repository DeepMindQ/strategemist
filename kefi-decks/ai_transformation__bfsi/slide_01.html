<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover — AI Transformation for BFSI & Insurance</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  .cover-display { font-family: var(--font-heading); font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  .cover-eyebrow { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brand); }
  .cover-subtitle { font-family: var(--font-body); font-size: 22px; font-weight: 400; color: var(--text-secondary); line-height: 1.4; max-width: 560px; }
  .right-callout { font-family: var(--font-num); font-size: 12px; font-weight: 500; color: var(--brand); letter-spacing: 0.10em; }
  .right-callout-num { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .top-right-label { font-family: var(--font-num); font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.12em; }
  .vertical-hairline { position: absolute; top: 240px; bottom: 120px; left: 70%; width: 1px; background: var(--border-strong); }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left logo (single image logo on cover) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:64px; left:104px;" alt="Kefi Tech">

  <!-- Top-right small label -->
  <div class="top-right-label" style="position:absolute; top:80px; right:104px;">AI TRANSFORMATION SERVICES · 2026</div>

  <!-- Vertical hairline at 70% width -->
  <div class="vertical-hairline" data-decor></div>

  <!-- Right-side stacked callouts -->
  <div style="position:absolute; top:260px; right:104px; display:flex; flex-direction:column; gap:32px; text-align:right;">
    <div class="right-callout"><span class="right-callout-num">01</span>Generative</div>
    <div class="right-callout"><span class="right-callout-num">02</span>Agentic</div>
    <div class="right-callout"><span class="right-callout-num">03</span>Enterprise</div>
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; max-width:680px;">
    <div class="cover-eyebrow">KEFI TECH · BFSI &amp; INSURANCE</div>
    <h1 class="cover-display" style="margin:18px 0 0 0; color: var(--primary);">AI Transformation</h1>
    <h1 class="cover-display" style="margin:0; color: var(--accent);">for BFSI &amp; Insurance.</h1>
    <div class="accent-bar" style="margin-top:24px;"></div>
    <p class="cover-subtitle" style="margin-top:24px;">A capability brief on Kefi Tech AI Transformation Services for BFSI &amp; Insurance.</p>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>01 / 12 · AI TRANSFORMATION SERVICES</span>
  </div>
</div>
</body>
</html>
