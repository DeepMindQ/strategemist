<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover — AI Transformation for BFSI & Insurance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .cover-display {
    font-family: var(--font-heading);
    font-size: var(--fs-display);
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.025em;
  }
  .cover-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .top-meta {
    font-family: var(--font-num);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .right-callouts {
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--brand);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .cover-subtitle {
    font-family: var(--font-body);
    font-size: var(--fs-h3);
    color: var(--text-secondary);
    line-height: 1.45;
    font-weight: 400;
    max-width: 580px;
  }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe"></div>

  <!-- Top-left logo -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:64px; left:104px;" alt="Kefi Tech">

  <!-- Top-right meta -->
  <div class="top-meta" style="position:absolute; top:88px; right:104px;">AI Transformation Services · 2026</div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:248px; left:104px; width:760px;">
    <div class="cover-eyebrow">Kefi Tech · BFSI &amp; Insurance</div>
    <h1 class="cover-display" style="margin-top:14px;">
      <span style="display:block; color: var(--primary);">AI Transformation</span>
      <span style="display:block; color: var(--accent);">for BFSI &amp; Insurance.</span>
    </h1>
    <div class="accent-bar" style="margin-top:22px;"></div>
    <p class="cover-subtitle" style="margin-top:22px;">A capability brief on Kefi Tech AI Transformation Services for BFSI &amp; Insurance.</p>
  </div>

  <!-- Right vertical hairline + callouts -->
  <div style="position:absolute; top:248px; right:104px; width:200px; height:240px; display:grid; grid-template-rows: 1fr 1fr 1fr; align-items:center; border-left:1px solid var(--border); padding-left:28px;">
    <div class="right-callouts">01 &nbsp;Generative</div>
    <div class="right-callouts">02 &nbsp;Agentic</div>
    <div class="right-callouts" style="color: var(--accent);">03 &nbsp;Enterprise</div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>01 / 12 · AI Transformation Services</span>
  </div>
</div>
</body>
</html>
