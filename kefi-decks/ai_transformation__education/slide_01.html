<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover — AI Transformation for Education</title>
  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="slide grid-bg" style="padding: 0;">
    <div class="brand-stripe" data-decor></div>

    <!-- Logo top-left -->
    <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech" style="position:absolute; top:64px; left:104px;">

    <!-- Top-right label -->
    <div style="position:absolute; top:78px; right:104px; font-family:var(--font-num); font-size:11px; color:var(--text-muted); letter-spacing:0.14em; text-transform:uppercase; font-weight:500;">
      AI Transformation Services · 2026
    </div>

    <!-- Center-left composition -->
    <div style="position:absolute; top:236px; left:104px; max-width:780px;">
      <div class="eyebrow" style="font-size:12px;">KEFI TECH · EDUCATION</div>
      <h1 style="font-family:var(--font-heading); font-size:64px; font-weight:800; line-height:1.04; margin:18px 0 0 0; letter-spacing:-0.025em;">
        <span style="color:var(--primary); display:block;">AI Transformation</span>
        <span style="color:var(--accent); display:block;">for Education.</span>
      </h1>
      <div class="accent-bar" style="margin-top:28px;"></div>
      <p style="font-family:var(--font-body); font-size:var(--fs-h3); color:var(--text-secondary); line-height:1.45; margin:22px 0 0 0; max-width:620px; font-weight:400;">
        A capability brief on Kefi Tech AI Transformation Services for Education.
      </p>
    </div>

    <!-- Right side: vertical hairline + three stacked callouts -->
    <div style="position:absolute; top:240px; right:104px; height:280px; display:flex; gap:22px; align-items:stretch;">
      <div style="display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; padding:6px 0;">
        <div style="font-family:var(--font-num); font-size:13px; color:var(--brand); letter-spacing:0.04em; font-weight:500;">
          <span style="color:var(--text-muted);">01</span> &nbsp;Generative
        </div>
        <div style="font-family:var(--font-num); font-size:13px; color:var(--brand); letter-spacing:0.04em; font-weight:500;">
          <span style="color:var(--text-muted);">02</span> &nbsp;Agentic
        </div>
        <div style="font-family:var(--font-num); font-size:13px; color:var(--brand); letter-spacing:0.04em; font-weight:500;">
          <span style="color:var(--text-muted);">03</span> &nbsp;Enterprise
        </div>
      </div>
      <div style="width:1px; background:var(--border);"></div>
    </div>

    <!-- Foot rail -->
    <div class="foot-rail bordered">
      <span class="text-wordmark">KEFI TECH</span>
      <span>01 / 12 · AI Transformation Services</span>
    </div>
  </div>
</body>
</html>
