<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover — AI Transformation for Education</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .cover-headline {
    font-family: var(--font-heading);
    font-size: var(--fs-display);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .cover-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 600;
  }
  .cover-callout {
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--brand);
    letter-spacing: 0.04em;
    line-height: 1.4;
    text-align: right;
  }
  .cover-callout-num {
    color: var(--accent);
    font-weight: 600;
    margin-right: 8px;
  }
  .top-right-label {
    font-family: var(--font-num);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:64px; left:104px;" alt="Kefi Tech">

  <!-- Top-right small label -->
  <div class="top-right-label" style="position:absolute; top:80px; right:72px;">
    AI TRANSFORMATION SERVICES · 2026
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; max-width:720px;">
    <div class="cover-eyebrow">KEFI TECH · EDUCATION</div>
    <h1 class="cover-headline" style="margin-top:18px; color: var(--primary);">AI Transformation</h1>
    <h1 class="cover-headline" style="color: var(--accent);">for Education.</h1>
    <div class="accent-bar" style="margin-top:24px;"></div>
    <p style="font-family: var(--font-body); font-size: var(--fs-h3); color: var(--text-secondary); line-height: 1.4; margin-top:20px; max-width:640px; font-weight:400;">
      A capability brief on Kefi Tech AI Transformation Services for Education.
    </p>
  </div>

  <!-- Right-side vertical hairline + callouts -->
  <div style="position:absolute; top:200px; right:96px; height:280px; display:flex; align-items:flex-start; gap:32px;">
    <div style="width:1px; height:280px; background: var(--border-soft);" data-decor></div>
    <div style="display:flex; flex-direction:column; gap:36px; padding-top:6px;">
      <div class="cover-callout"><span class="cover-callout-num">01</span>Generative AI Solutions</div>
      <div class="cover-callout"><span class="cover-callout-num">02</span>Agentic AI &amp; Automation</div>
      <div class="cover-callout"><span class="cover-callout-num">03</span>Enterprise Knowledge &amp; RAG</div>
    </div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>01 / 12 · AI TRANSFORMATION SERVICES</span>
  </div>
</div>
</body>
</html>
