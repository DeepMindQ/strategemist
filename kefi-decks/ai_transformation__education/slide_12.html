<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="global.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  .close-eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase; color: var(--brand); }
  .close-display { font-family: var(--font-heading); font-size: 56px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .close-contact { font-family: var(--font-body); font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
  .close-callout { font-family: var(--font-heading); font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
  .top-meta { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe"></div>
  <aside data-notes hidden>none</aside>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" alt="Kefi Tech logo" class="kefi-logo-lg" style="position:absolute; top:96px; left:104px;">

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; max-width:680px;">
    <div class="close-eyebrow">GET IN TOUCH</div>
    <h1 class="close-display" style="margin-top:18px;">
      <span style="color: var(--primary); display:block;">Let us engineer</span>
      <span style="color: var(--accent); display:block;">what is next.</span>
    </h1>
    <div style="margin-top:32px; display:flex; flex-direction:column; gap:6px;">
      <div class="close-contact">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="close-contact">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right vertical hairline + 3 callouts -->
  <div style="position:absolute; top:240px; right:104px; bottom:120px; display:flex; flex-direction:row; gap:36px; align-items:flex-end;">
    <div style="width:1px; background: var(--border-soft); align-self:stretch;"></div>
    <div style="display:flex; flex-direction:column; gap:36px; padding-bottom:8px; min-width:200px; text-align:right;">
      <div class="close-callout" style="color: var(--text-muted);">Discover.</div>
      <div class="close-callout" style="color: var(--brand);">Engineer.</div>
      <div class="close-callout" style="color: var(--accent);">Scale.</div>
    </div>
  </div>

  <!-- Foot rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
