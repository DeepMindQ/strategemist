<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .closing-headline {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .closing-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 600;
  }
  .contact-line {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .closing-callout {
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--brand);
    letter-spacing: 0.06em;
    text-align: right;
    line-height: 1.4;
  }
  .closing-callout.accent { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Logo top-left -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" style="position:absolute; top:96px; left:104px;" alt="Kefi Tech">

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; max-width:720px;">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline" style="margin-top:18px; color: var(--primary);">Let us engineer</h1>
    <h1 class="closing-headline" style="color: var(--accent);">what is next.</h1>
    <div style="margin-top:28px;">
      <div class="contact-line">info@kefitech.com  ·  www.kefitech.com</div>
      <div class="contact-line">Bengaluru, India  ·  Hyderabad, India</div>
    </div>
  </div>

  <!-- Right-side vertical hairline + callouts -->
  <div style="position:absolute; top:240px; right:96px; height:280px; display:flex; align-items:flex-start; gap:32px;">
    <div style="width:1px; height:280px; background: var(--border-soft);" data-decor></div>
    <div style="display:flex; flex-direction:column; gap:36px; padding-top:6px; align-items:flex-end;">
      <div class="closing-callout">Discover.</div>
      <div class="closing-callout">Engineer.</div>
      <div class="closing-callout accent">Scale.</div>
    </div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
