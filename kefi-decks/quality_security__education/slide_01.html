<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 01 — Cover</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left: real logo -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="KEFI TECH" style="position:absolute; top:64px; left:104px;">

  <!-- Top-right small label -->
  <div style="position:absolute; top:88px; right:96px; font-family:var(--font-num); font-size:11px; color:var(--text-muted); letter-spacing:0.16em; text-transform:uppercase;">
    QUALITY &amp; SECURITY ENGINEERING SERVICES · 2026
  </div>

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; width:760px;">
    <div class="eyebrow" style="margin-bottom:22px;">KEFI TECH · EDUCATION</div>
    <h1 style="font-family:var(--font-heading); font-size:64px; font-weight:800; line-height:1.05; letter-spacing:-0.025em; margin:0;">
      <span style="color:var(--primary); display:block;">Quality &amp; Security Engineering</span>
      <span style="color:var(--accent); display:block;">for Education.</span>
    </h1>
    <div class="accent-bar" style="margin-top:28px; margin-bottom:18px;"></div>
    <p style="font-family:var(--font-body); font-size:22px; color:var(--text-secondary); line-height:1.45; margin:0; max-width:660px; font-weight:400;">
      A capability brief on Kefi Tech Quality &amp; Security Engineering Services for Education.
    </p>
  </div>

  <!-- Right side: vertical hairline + stacked callouts -->
  <div style="position:absolute; top:248px; left:980px; width:200px; height:340px; display:flex; flex-direction:column; justify-content:flex-end; padding-left:24px; border-left:1px solid var(--border-soft);">
    <div style="font-family:var(--font-num); font-size:11px; color:var(--brand); letter-spacing:0.10em; line-height:1; padding:6px 0;">
      <span style="color:var(--text-muted); margin-right:10px; font-weight:500;">01</span><span style="font-weight:600;">Application</span>
    </div>
    <div style="height:1px; background:var(--border); margin:18px 0;"></div>
    <div style="font-family:var(--font-num); font-size:11px; color:var(--brand); letter-spacing:0.10em; line-height:1; padding:6px 0;">
      <span style="color:var(--text-muted); margin-right:10px; font-weight:500;">02</span><span style="font-weight:600;">VAPT</span>
    </div>
    <div style="height:1px; background:var(--border); margin:18px 0;"></div>
    <div style="font-family:var(--font-num); font-size:11px; color:var(--brand); letter-spacing:0.10em; line-height:1; padding:6px 0;">
      <span style="color:var(--text-muted); margin-right:10px; font-weight:500;">03</span><span style="font-weight:600;">Performance</span>
    </div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>01 / 12 · QUALITY &amp; SECURITY ENGINEERING SERVICES</span>
  </div>
</div>
</body>
</html>
