<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 12 — Closing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor></div>

  <!-- Top-left: real logo (single logo on slide 12 of 12) -->
  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="KEFI TECH" style="position:absolute; top:96px; left:104px;">

  <!-- Center-left composition -->
  <div style="position:absolute; top:240px; left:104px; width:780px;">
    <div class="eyebrow" style="margin-bottom:22px;">GET IN TOUCH</div>
    <h1 style="font-family:var(--font-heading); font-size:56px; font-weight:700; line-height:1.05; letter-spacing:-0.025em; margin:0;">
      <span style="color:var(--primary); display:block;">Let us engineer</span>
      <span style="color:var(--accent); display:block;">what is next.</span>
    </h1>
    <div class="accent-bar" style="margin-top:28px; margin-bottom:22px;"></div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5; font-weight:500;">
        info@kefitech.com  ·  www.kefitech.com
      </div>
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5; font-weight:500;">
        Bengaluru, India  ·  Hyderabad, India
      </div>
    </div>
  </div>

  <!-- Right side: vertical hairline + three callouts -->
  <div style="position:absolute; top:240px; left:980px; width:240px; height:280px; display:grid; grid-template-rows:1fr 1fr 1fr; align-items:end; padding-left:24px; border-left:1px solid var(--border-soft);">
    <div style="font-family:var(--font-heading); font-size:24px; font-weight:700; color:var(--primary); line-height:1.2; letter-spacing:-0.01em; text-align:right; padding:6px 0;">
      Discover.
    </div>
    <div style="font-family:var(--font-heading); font-size:24px; font-weight:700; color:var(--primary); line-height:1.2; letter-spacing:-0.01em; text-align:right; padding:6px 0;">
      Engineer.
    </div>
    <div style="font-family:var(--font-heading); font-size:24px; font-weight:700; color:var(--accent); line-height:1.2; letter-spacing:-0.01em; text-align:right; padding:6px 0;">
      Scale.
    </div>
  </div>

  <!-- Bottom rail -->
  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
