<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Closing — Kefi Tech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="global.css" />
  <aside data-notes hidden>none</aside>
</head>
<body>
  <div class="slide grid-bg" style="padding:0;">

    <!-- Brand stripe (6px) -->
    <div class="brand-stripe" data-decor aria-hidden="true"></div>

    <!-- Top-left logo (single logo per slide discipline) -->
    <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech"
         style="position:absolute; top:96px; left:104px;" />

    <!-- Center composition -->
    <div style="position:absolute; top:240px; left:104px; right:104px; display:grid; grid-template-columns: 1.35fr 1fr; gap:48px; align-items:start;">

      <!-- LEFT: hero -->
      <div style="display:flex; flex-direction:column; gap:22px;">
        <div class="eyebrow" style="font-size:11px; letter-spacing:0.22em;">GET IN TOUCH</div>

        <h1 style="font-family:var(--font-heading); font-weight:700; font-size:56px; line-height:1.05; letter-spacing:-0.02em; margin:0;">
          <span style="display:block; color:var(--primary);">Let us engineer</span>
          <span style="display:block; color:var(--accent);">what is next.</span>
        </h1>

        <div class="accent-bar"></div>

        <div style="font-family:var(--font-body); font-size:16px; line-height:1.6; color:var(--text-secondary); display:flex; flex-direction:column; gap:4px;">
          <div>info@kefitech.com  ·  www.kefitech.com</div>
          <div>Bengaluru, India  ·  Hyderabad, India</div>
        </div>
      </div>

      <!-- RIGHT: vertical hairline + 3 callouts (right-aligned via align-items:end) -->
      <div style="position:relative; min-height:300px; padding-right:32px; display:grid; align-items:end;">
        <div data-decor aria-hidden="true"
             style="position:absolute; right:0; top:0; bottom:0; width:1px; background:var(--border);"></div>

        <div style="display:flex; flex-direction:column; gap:34px; align-items:flex-end; text-align:right;">
          <div style="font-family:var(--font-heading); font-weight:700; font-size:28px; color:var(--brand); letter-spacing:-0.01em; line-height:1.1;">Discover.</div>
          <div style="font-family:var(--font-heading); font-weight:700; font-size:28px; color:var(--brand); letter-spacing:-0.01em; line-height:1.1;">Engineer.</div>
          <div style="font-family:var(--font-heading); font-weight:700; font-size:28px; color:var(--accent); letter-spacing:-0.01em; line-height:1.1;">Scale.</div>
        </div>
      </div>
    </div>

    <!-- Bottom rail -->
    <div class="foot-rail bordered" style="left:104px; right:104px; bottom:40px;">
      <span class="text-wordmark">KEFI TECH</span>
      <span>12 / 12</span>
      <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
    </div>

  </div>
</body>
</html>
