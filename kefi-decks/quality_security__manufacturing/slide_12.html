<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Manufacturing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="global.css">
<style>
  .closing-canvas { position: relative; }
  .closing-logo { position: absolute; top: 96px; left: 104px; z-index: 4; }

  .closing-headline-block { position: absolute; left: 104px; top: 240px; max-width: 720px; z-index: 4; }
  .closing-eyebrow { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brand); font-weight: 700; margin-bottom: 22px; }
  .closing-headline { font-family: var(--font-heading); font-size: 56px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; color: var(--primary); }
  .closing-headline .accent-line { color: var(--accent); display: block; margin-top: 4px; }
  .closing-contacts { margin-top: 28px; font-family: var(--font-body); font-size: 16px; color: var(--text-secondary); line-height: 1.7; }

  /* Right rail at ~70% width (x=896) */
  .closing-right-rail { position: absolute; top: 240px; right: 384px; width: 1px; height: 280px; background: var(--border-strong); z-index: 4; }
  .closing-right-callouts { position: absolute; top: 240px; right: 96px; width: 280px; display: flex; flex-direction: column; gap: 36px; align-items: flex-end; z-index: 4; }
  .right-callout { font-family: var(--font-num); font-size: 18px; color: var(--brand); font-weight: 600; letter-spacing: 0.04em; text-align: right; }
  .right-callout.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide closing-canvas grid-bg">
  <div class="brand-stripe"></div>
  <img src="assets/kefi_logo.png" class="kefi-logo-lg closing-logo" alt="Kefi Tech">

  <div class="closing-headline-block">
    <div class="closing-eyebrow">GET IN TOUCH</div>
    <h1 class="closing-headline">
      Let us engineer
      <span class="accent-line">what is next.</span>
    </h1>
    <div class="closing-contacts">
      <div>info@kefitech.com&nbsp;&nbsp;·&nbsp;&nbsp;www.kefitech.com</div>
      <div>Bengaluru, India&nbsp;&nbsp;·&nbsp;&nbsp;Hyderabad, India</div>
    </div>
  </div>

  <div class="closing-right-rail" data-decor aria-hidden="true"></div>
  <div class="closing-right-callouts">
    <div class="right-callout">Discover.</div>
    <div class="right-callout">Engineer.</div>
    <div class="right-callout accent">Scale.</div>
  </div>

  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM · WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
