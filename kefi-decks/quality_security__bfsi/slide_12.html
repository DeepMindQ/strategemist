<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech logo"
       style="position:absolute; top:96px; left:104px;">

  <div style="position:absolute; top:240px; left:104px; width:820px;">
    <div style="font-family:var(--font-body); font-size:11px;
                color:var(--brand); letter-spacing:0.22em;
                text-transform:uppercase; font-weight:600;
                margin-bottom:24px;">
      GET IN TOUCH
    </div>
    <h1 style="font-family:var(--font-heading); font-weight:700;
               font-size:56px; line-height:1.05; color:var(--primary);
               margin:0; letter-spacing:-0.025em;">
      Let us engineer<br>
      <span style="color:var(--accent);">what is next.</span>
    </h1>
    <div style="margin-top:32px; display:flex; flex-direction:column; gap:8px;">
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5;">
        info@kefitech.com&nbsp;&nbsp;&middot;&nbsp;&nbsp;www.kefitech.com
      </div>
      <div style="font-family:var(--font-body); font-size:16px; color:var(--text-secondary); line-height:1.5;">
        Bengaluru, India&nbsp;&nbsp;&middot;&nbsp;&nbsp;Hyderabad, India
      </div>
    </div>
  </div>

  <div style="position:absolute; top:240px; left:920px; right:104px;
              display:grid; grid-template-columns:1px 1fr; gap:28px; align-items:end; height:300px;">
    <div style="width:1px; height:100%; background:var(--border-strong);"></div>
    <div style="display:flex; flex-direction:column; gap:36px; align-items:flex-end; text-align:right; padding-bottom:6px;">
      <div style="font-family:var(--font-num); font-size:14px; color:var(--brand); letter-spacing:0.14em; font-weight:600;">Discover.</div>
      <div style="font-family:var(--font-num); font-size:14px; color:var(--brand); letter-spacing:0.14em; font-weight:600;">Engineer.</div>
      <div style="font-family:var(--font-num); font-size:14px; color:var(--accent); letter-spacing:0.14em; font-weight:600;">Scale.</div>
    </div>
  </div>

  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM &middot; WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
