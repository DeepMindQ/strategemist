<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closing — Kefi Tech</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
<div class="slide grid-bg">
  <div class="brand-stripe" data-decor aria-hidden="true"></div>

  <img src="assets/kefi_logo.png" class="kefi-logo-lg" alt="Kefi Tech logo"
       style="position:absolute; top:96px; left:104px;">

  <div style="position:absolute; top:240px; left:104px; width:780px;">
    <div style="font-family:var(--font-body); font-size:11px;
                color:var(--brand); letter-spacing:0.22em;
                text-transform:uppercase; font-weight:600;
                margin-bottom:22px;">
      GET IN TOUCH
    </div>
    <h1 style="font-family:var(--font-heading); font-weight:700;
               font-size:56px; line-height:1.05; color:var(--primary);
               margin:0; letter-spacing:-0.025em;">
      Let us engineer<br>
      <span style="color:var(--accent); font-weight:700;">what is next.</span>
    </h1>
    <div class="accent-bar" style="margin-top:30px;"></div>

    <div style="margin-top:30px; display:flex; flex-direction:column; gap:8px;">
      <div style="font-family:var(--font-body); font-size:16px;
                  color:var(--text-secondary); line-height:1.4; font-weight:400;">
        info@kefitech.com&nbsp;&nbsp;&middot;&nbsp;&nbsp;www.kefitech.com
      </div>
      <div style="font-family:var(--font-body); font-size:16px;
                  color:var(--text-secondary); line-height:1.4; font-weight:400;">
        Bengaluru, India&nbsp;&nbsp;&middot;&nbsp;&nbsp;Hyderabad, India
      </div>
    </div>
  </div>

  <div style="position:absolute; top:240px; left:980px; right:104px;
              display:flex; gap:24px; align-items:flex-start;">
    <div style="width:1px; height:280px; background:var(--border-strong); flex-shrink:0;" data-decor aria-hidden="true"></div>
    <div style="display:flex; flex-direction:column; gap:36px; padding-top:6px; margin-left:auto; text-align:right;">
      <div style="font-family:var(--font-heading); font-size:24px;
                  color:var(--brand); letter-spacing:-0.01em;
                  font-weight:700;">Discover.</div>
      <div style="font-family:var(--font-heading); font-size:24px;
                  color:var(--brand); letter-spacing:-0.01em;
                  font-weight:700;">Engineer.</div>
      <div style="font-family:var(--font-heading); font-size:24px;
                  color:var(--accent); letter-spacing:-0.01em;
                  font-weight:700;">Scale.</div>
    </div>
  </div>

  <div class="foot-rail bordered">
    <span class="text-wordmark">KEFI TECH</span>
    <span>12 / 12</span>
    <span>INFO@KEFITECH.COM &middot; WWW.KEFITECH.COM</span>
  </div>
</div>
</body>
</html>
